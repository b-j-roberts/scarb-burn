[package]
name = "scarb-burn"
version = "2.10.0"
edition = "2021"
publish = false
authors = ["Michael Zaikin <michael.zaikin@starkware.co>"]

[dependencies]
anyhow = "1"
thiserror = "2"
camino = "1"
clap = { version = "4", features = ["derive", "env", "string"] }
num-bigint = "0.4"
serde = "1"
serde_json = "1"
inferno = "0.12.1"
webbrowser = "0.8"

# Local cairo fork
cairo-lang-runner = { path = "../cairo/crates/cairo-lang-runner" }
cairo-lang-sierra = { path = "../cairo/crates/cairo-lang-sierra" }
cairo-lang-sierra-gas = { path = "../cairo/crates/cairo-lang-sierra-gas" }
cairo-lang-utils = { path = "../cairo/crates/cairo-lang-utils" }

# Local scarb fork
scarb-metadata = { path = "../scarb/scarb-metadata" }
scarb-ui = { path = "../scarb/utils/scarb-ui" }

pprof = { version = "0.12", features = ["protobuf-codec"], default-features = false }
flate2 = "1.0"
